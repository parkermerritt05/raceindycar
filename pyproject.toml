[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raceindycar"
version = "0.1"
description = "IndyCar data access, similar to FastF1"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "requests",
    "requests-cache",
    "pdfplumber",
    "matplotlib",
]
classifiers = ["Programming Language :: Python :: 3",
            "Operating System :: OS Independent"]
license = "MIT"
license-files = ["LICEN[CS]E*"]


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

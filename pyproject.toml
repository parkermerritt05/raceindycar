[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fastindycar"
version = "0.1.0"
description = "FastF1-style IndyCar data access"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "requests",
    "requests-cache",
    "pdfplumber",
    "matplotlib",
]
classifiers = ["Programming Language :: Python :: 3",
            "Operating System :: OS Independent"]
license = "MIT"
license-files = ["LICEN[CS]E*"]


[tool.setuptools]
packages = ["raceindycar"]
